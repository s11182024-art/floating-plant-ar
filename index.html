
<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>漂浮性植物 AR 探索</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft JhengHei", sans-serif;
      background: #10251c;
      color: white;
      overflow: hidden;
    }

    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 14px;
      text-align: center;
      z-index: 10;
      background: rgba(0,0,0,0.55);
    }

    .header h2 {
      margin: 0;
      font-size: 20px;
    }

    #status {
      margin-top: 7px;
      font-size: 13px;
      color: #d8f3dc;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .controls {
      position: fixed;
      bottom: 10px;
      left: 0;
      width: 100%;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 8px;
      max-height: 58vh;
      overflow-y: auto;
    }

    .control-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 11px 15px;
      font-size: 14px;
      font-weight: bold;
      color: #173b2a;
      background: #d8f3dc;
      min-width: 72px;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      background: #95d5b2;
      transform: scale(0.96);
    }

    .reset {
      background: #f4e7b2;
    }

    .hint {
      font-size: 13px;
      color: white;
      background: rgba(0,0,0,0.65);
      border-radius: 20px;
      padding: 8px 14px;
      text-align: center;
    }

    .water-panel {
      width: min(95%, 420px);
      background: rgba(10,40,65,0.92);
      border-radius: 16px;
      padding: 12px;
      text-align: center;
    }

    .water-panel h3 {
      margin: 4px 0 10px;
      font-size: 17px;
    }

    .water-label {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-bottom: 8px;
    }

    #waterSlider {
      width: 100%;
      accent-color: #55c8ef;
      cursor: pointer;
    }

    .water-buttons {
      display: flex;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .water-buttons button {
      font-size: 12px;
      padding: 10px;
      min-width: 85px;
    }

    .small-note {
      font-size: 11px;
      color: #d8e8e8;
      margin-top: 7px;
    }

    button:disabled,
    input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

  </style>
</head>

<body>

  <!-- 網頁標題 -->
  <div class="header">

    <h2>🌿 漂浮性植物 AR 探索</h2>

    <div id="status">
      正在載入 3D 模型...
    </div>

  </div>


  <!-- AR 場景 -->
  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: no;
      uiScanning: no;
      uiError: no;
    "

    color-space="sRGB"

    renderer="colorManagement: true"

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false">


    <a-assets>

      <a-asset-item
        id="plantModel"
        src="./floating-plant.glb">
      </a-asset-item>

    </a-assets>


    <!-- 相機 -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <!-- 圖片辨識區 -->
    <a-entity
      mindar-image-target="targetIndex: 0">


      <!-- 整個 GLB 場景固定 -->
      <a-gltf-model

        id="sceneModel"

        src="#plantModel"

        position="0 0 0.1"

        rotation="0 0 0"

        scale="0.3 0.3 0.3">

      </a-gltf-model>


    </a-entity>

  </a-scene>


  <!-- 操作面板 -->
  <div class="controls">

    <div class="hint">
      📷 請將相機對準漂浮性植物圖片
    </div>


    <!-- 水位調整 -->
    <div class="water-panel">

      <h3>💧 水位高度調整</h3>

      <div class="water-label">

        <span>水位移動量</span>

        <span id="waterValue">0.00</span>

      </div>

      <input
        type="range"
        id="waterSlider"
        min="-0.5"
        max="0.5"
        step="0.01"
        value="0"
        disabled>

      <div class="water-buttons">

        <button id="lowerBtn"
          onclick="changeWater(-0.05)"
          disabled>
          ↓ 降低水位
        </button>

        <button id="raiseBtn"
          onclick="changeWater(0.05)"
          disabled>
          ↑ 提高水位
        </button>

        <button class="reset"
          onclick="resetWater()"
          disabled
          id="waterReset">
          恢復水位
        </button>

      </div>

      <div class="small-note">
        只有水面和浮萍會跟著水位移動
      </div>

    </div>


    <!-- 浮萍旋轉 -->
    <div class="control-row">

      <button onclick="rotatePlant('left')">
        ↶ 左轉
      </button>

      <button onclick="rotatePlant('right')">
        ↷ 右轉
      </button>

    </div>


    <div class="control-row">

      <button onclick="rotatePlant('up')">
        ↑ 上翻
      </button>

      <button onclick="rotatePlant('down')">
        ↓ 下翻
      </button>

    </div>


    <!-- 浮萍縮放 -->
    <div class="control-row">

      <button onclick="zoomPlant('in')">
        ＋ 放大
      </button>

      <button onclick="zoomPlant('out')">
        － 縮小
      </button>

      <button class="reset" onclick="resetPlant()">
        重設浮萍
      </button>

    </div>

  </div>


  <script>

    // =====================================
    // 一、取得 GLB 模型
    // =====================================

    const sceneModel =
      document.querySelector("#sceneModel");

    const statusText =
      document.querySelector("#status");


    // 需要獨立控制的模型物件
    let plantNode = null;
    let waterNode = null;
    let veinNode = null;

    let modelReady = false;


    // 保存物件原始位置
    let plantOriginalPosition = null;
    let waterOriginalPosition = null;
    let veinOriginalPosition = null;

    // 保存浮萍原始旋轉與大小
    let plantOriginalRotation = null;
    let plantOriginalScale = null;


    // =====================================
    // 二、GLB 載入完成
    // =====================================

    sceneModel.addEventListener("model-loaded", function() {

      const root =
        sceneModel.getObject3D("mesh");

      if (!root) {

        statusText.innerText =
          "模型載入失敗，請檢查 GLB 檔案";

        return;

      }


      // 依照 GLB 內部名稱尋找物件
      plantNode =
        root.getObjectByName("Duckweed_Plant");

      waterNode =
        root.getObjectByName("Duckweed_WaterSurface");

      veinNode =
        root.getObjectByName("FrondVein.005");


      // 確認必要物件
      if (!plantNode || !waterNode) {

        statusText.innerText =
          "找不到浮萍或水面節點，請檢查模型名稱";

        console.error({
          plantNode,
          waterNode,
          veinNode
        });

        return;

      }


      // 保存原始位置
      plantOriginalPosition =
        plantNode.position.clone();

      waterOriginalPosition =
        waterNode.position.clone();

      if (veinNode) {

        veinOriginalPosition =
          veinNode.position.clone();

      }


      // 保存原始旋轉
      plantOriginalRotation =
        plantNode.rotation.clone();

      // 保存原始大小
      plantOriginalScale =
        plantNode.scale.clone();


      // 啟用操作功能
      modelReady = true;

      enableControls();

      statusText.innerText =
        "✅ 模型載入完成！請掃描植物圖片";

      console.log("GLB 物件辨識成功");

      console.log("浮萍：", plantNode);

      console.log("水面：", waterNode);

      console.log("葉片脈絡：", veinNode);

    });


    // =====================================
    // 三、啟用控制按鈕
    // =====================================

    function enableControls() {

      document.querySelector("#waterSlider").disabled = false;

      document.querySelector("#lowerBtn").disabled = false;

      document.querySelector("#raiseBtn").disabled = false;

      document.querySelector("#waterReset").disabled = false;

    }


    // =====================================
    // 四、圖片辨識狀態
    // =====================================

    const target =
      document.querySelector("[mindar-image-target]");

    target.addEventListener("targetFound", () => {

      statusText.innerText =
        "✅ 已辨識植物圖片！可以開始探索";

    });

    target.addEventListener("targetLost", () => {

      statusText.innerText =
        "請重新將相機對準植物圖片";

    });


    // =====================================
    // 五、水位調整
    // 只移動水面、浮萍與葉片脈絡
    // =====================================

    const waterSlider =
      document.querySelector("#waterSlider");

    const waterValue =
      document.querySelector("#waterValue");


    const initialWaterLevel = 0;

    let currentWaterLevel = initialWaterLevel;


    function setWaterLevel(value) {

      if (!modelReady) return;


      const level = Math.max(
        -0.5,
        Math.min(0.5, Number(value))
      );

      currentWaterLevel = level;


      // 水面移動
      waterNode.position.y =
        waterOriginalPosition.y + level;


      // 浮萍移動
      plantNode.position.y =
        plantOriginalPosition.y + level;


      // 葉片脈絡一起移動
      if (veinNode) {

        veinNode.position.y =
          veinOriginalPosition.y + level;

      }


      // 更新介面
      waterSlider.value = level;

      waterValue.innerText =
        level.toFixed(2);

    }


    // 滑桿
    waterSlider.addEventListener("input", function() {

      setWaterLevel(this.value);

    });


    // 按鈕
    function changeWater(amount) {

      setWaterLevel(
        currentWaterLevel + amount
      );

    }


    // 恢復水位
    function resetWater() {

      setWaterLevel(initialWaterLevel);

    }


    // =====================================
    // 六、浮萍旋轉
    // 只旋轉 Duckweed_Plant
    // =====================================

    function rotatePlant(direction) {

      if (!modelReady) return;

      const angle = Math.PI / 12;

      if (direction === "left") {

        plantNode.rotation.y -= angle;

      }

      if (direction === "right") {

        plantNode.rotation.y += angle;

      }

      if (direction === "up") {

        plantNode.rotation.x -= angle;

      }

      if (direction === "down") {

        plantNode.rotation.x += angle;

      }

    }


    // =====================================
    // 七、浮萍放大縮小
    // =====================================

    let zoomFactor = 1;


    function zoomPlant(direction) {

      if (!modelReady) return;

      if (direction === "in") {

        zoomFactor = Math.min(
          zoomFactor * 1.2,
          3
        );

      }

      if (direction === "out") {

        zoomFactor = Math.max(
          zoomFactor / 1.2,
          0.3
        );

      }

      plantNode.scale
        .copy(plantOriginalScale)
        .multiplyScalar(zoomFactor);

    }


    // =====================================
    // 八、重設浮萍
    // =====================================

    function resetPlant() {

      if (!modelReady) return;

      zoomFactor = 1;

      plantNode.rotation.copy(
        plantOriginalRotation
      );

      plantNode.scale.copy(
        plantOriginalScale
      );

    }


  </script>

</body>
</html>
