
<!DOCTYPE html>
<html lang="zh-Hant">

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>漂浮性植物 AR 探索</title>

<!-- Three.js 與 MindAR 模組 -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow: hidden;
  font-family: "Microsoft JhengHei", sans-serif;
  background: #10251c;
  color: white;
}

#container {
  width: 100vw;
  height: 100dvh;
  position: fixed;
  inset: 0;
  overflow: hidden;
}

.header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  padding: 14px;
  text-align: center;
  z-index: 10;
  background: rgba(0,0,0,0.55);
}

.header h2 {
  margin: 0;
  font-size: 20px;
}

#status {
  font-size: 13px;
  margin-top: 7px;
  color: #d8f3dc;
}

.controls {
  position: fixed;
  bottom: 10px;
  left: 0;
  width: 100%;
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 8px;
  max-height: 58vh;
  overflow-y: auto;
}

.control-row {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
}

button {
  border: none;
  border-radius: 12px;
  padding: 11px 15px;
  font-size: 14px;
  font-weight: bold;
  color: #173b2a;
  background: #d8f3dc;
  min-width: 75px;
  cursor: pointer;
  touch-action: manipulation;
}

button:active {
  background: #95d5b2;
  transform: scale(0.96);
}

button:disabled {
  opacity: 0.5;
}

.reset {
  background: #f4e7b2;
}

.hint {
  font-size: 13px;
  background: rgba(0,0,0,0.65);
  border-radius: 20px;
  padding: 8px 14px;
  text-align: center;
}

.water-panel {
  width: min(95%, 420px);
  background: rgba(10,40,65,0.93);
  border-radius: 16px;
  padding: 12px;
  text-align: center;
}

.water-panel h3 {
  margin: 4px 0 10px;
  font-size: 17px;
}

.water-label {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
  margin-bottom: 8px;
}

#waterSlider {
  width: 100%;
  accent-color: #55c8ef;
}

.water-buttons {
  display: flex;
  justify-content: center;
  gap: 6px;
  flex-wrap: wrap;
}

.water-buttons button {
  font-size: 12px;
  padding: 10px;
  min-width: 85px;
}

.note {
  font-size: 11px;
  color: #d8e8e8;
  margin-top: 7px;
}

#startButton {
  background: #65c58a;
  color: #103b24;
  font-size: 17px;
  padding: 14px 25px;
}

</style>
</head>

<body>

<div id="container"></div>

<div class="header">
  <h2>🌿 漂浮性植物 AR 探索</h2>
  <div id="status">請按下開始體驗</div>
</div>

<div class="controls">

  <div class="hint">
    📷 將手機相機對準漂浮性植物圖片
  </div>

  <button id="startButton">
    📷 開始 AR 體驗
  </button>

  <!-- 水位控制 -->
  <div class="water-panel">

    <h3>💧 水位高度調整</h3>

    <div class="water-label">
      <span>水位移動量</span>
      <span id="waterValue">0.00</span>
    </div>

    <input
      type="range"
      id="waterSlider"
      min="-0.5"
      max="0.5"
      step="0.01"
      value="0"
      disabled>

    <div class="water-buttons">

      <button id="lowerBtn" disabled>
        ↓ 降低水位
      </button>

      <button id="raiseBtn" disabled>
        ↑ 提高水位
      </button>

      <button id="waterReset" class="reset" disabled>
        恢復水位
      </button>

    </div>

    <div class="note">
      水面與浮萍同步升降，其他場景保持固定
    </div>

  </div>

  <!-- 旋轉 -->
  <div class="control-row">
    <button id="leftBtn" disabled>↶ 左轉</button>
    <button id="rightBtn" disabled>↷ 右轉</button>
  </div>

  <div class="control-row">
    <button id="upBtn" disabled>↑ 上翻</button>
    <button id="downBtn" disabled>↓ 下翻</button>
  </div>

  <!-- 縮放 -->
  <div class="control-row">
    <button id="zoomIn" disabled>＋ 放大</button>
    <button id="zoomOut" disabled>－ 縮小</button>
    <button id="modelReset" class="reset" disabled>
      重設浮萍
    </button>
  </div>

</div>


<script type="module">

import * as THREE from "three";

import { GLTFLoader }
from "three/addons/loaders/GLTFLoader.js";

import { MindARThree }
from "mindar-image-three";


// ==================================
// 一、基本設定
// ==================================

const container =
document.querySelector("#container");

const statusText =
document.querySelector("#status");

const startButton =
document.querySelector("#startButton");

const slider =
document.querySelector("#waterSlider");

const waterValue =
document.querySelector("#waterValue");

let mindarThree = null;

let modelReady = false;

let started = false;


// ==================================
// 二、Three.js 物件
// ==================================

let anchor = null;

let modelRoot = null;

let plantNode = null;

let waterNode = null;

let veinNode = null;


// 原始位置
let plantOriginalPosition;

let waterOriginalPosition;

let veinOriginalPosition;


// 原始旋轉與縮放
let plantOriginalRotation;

let plantOriginalScale;


// 初始參數
const INITIAL_SCALE = 0.3;

const INITIAL_WATER = 0;

let currentWater = INITIAL_WATER;

let zoomFactor = 1;


// ==================================
// 三、載入 GLB
// ==================================

const loader = new GLTFLoader();

async function loadModel() {

  statusText.innerText = "正在載入 3D 模型...";

  try {

    const gltf = await loader.loadAsync(
      "./floating-plant.glb"
    );

    modelRoot = gltf.scene;

    // 整個模型的基礎大小
    modelRoot.scale.setScalar(INITIAL_SCALE);

    // 放置於圖片辨識錨點
    anchor.group.add(modelRoot);


    // 尋找 GLB 內的物件
    plantNode =
      modelRoot.getObjectByName("Duckweed_Plant");

    waterNode =
      modelRoot.getObjectByName("Duckweed_WaterSurface");

    veinNode =
      modelRoot.getObjectByName("FrondVein.005");


    // 確認必要物件
    if (!plantNode || !waterNode) {

      throw new Error(
        "找不到 Duckweed_Plant 或 Duckweed_WaterSurface"
      );

    }


    // 保存原始位置
    plantOriginalPosition =
      plantNode.position.clone();

    waterOriginalPosition =
      waterNode.position.clone();

    if (veinNode) {

      veinOriginalPosition =
        veinNode.position.clone();

    }


    // 保存原始旋轉
    plantOriginalRotation =
      plantNode.rotation.clone();

    // 保存原始縮放
    plantOriginalScale =
      plantNode.scale.clone();


    modelReady = true;

    enableControls();

    statusText.innerText =
      "✅ 3D 模型載入完成，請掃描圖片";

    console.log("GLB 載入成功");

    console.log("浮萍:", plantNode);

    console.log("水面:", waterNode);

    console.log("葉脈:", veinNode);

  } catch (error) {

    console.error(error);

    statusText.innerText =
      "模型載入失敗：" + error.message;

  }

}


// ==================================
// 四、建立 AR
// ==================================

function setupAR() {

  mindarThree = new MindARThree({

    container: container,

    imageTargetSrc: "./targets.mind",

    filterMinCF: 0.001,

    filterBeta: 0.01

  });

  const { renderer, scene, camera } =
    mindarThree;


  // 光源
  const ambientLight =
    new THREE.AmbientLight(0xffffff, 1.5);

  scene.add(ambientLight);


  const directionalLight =
    new THREE.DirectionalLight(0xffffff, 2);

  directionalLight.position.set(1, 3, 2);

  scene.add(directionalLight);


  // 圖片辨識錨點
  anchor = mindarThree.addAnchor(0);

}


// ==================================
// 五、開始 AR
// ==================================

startButton.addEventListener("click", async () => {

  if (started) return;

  startButton.disabled = true;

  statusText.innerText = "正在啟動相機...";

  try {

    setupAR();

    await loadModel();

    await mindarThree.start();

    started = true;

    startButton.style.display = "none";

    statusText.innerText =
      "📷 請將相機對準植物圖片";

    const { renderer, scene, camera } =
      mindarThree;

    renderer.setAnimationLoop(() => {

      renderer.render(scene, camera);

    });

  } catch (error) {

    console.error(error);

    statusText.innerText =
      "啟動失敗，請確認相機權限及網路";

    startButton.disabled = false;

  }

});


// ==================================
// 六、啟用按鈕
// ==================================

function enableControls() {

  const ids = [

    "waterSlider",
    "lowerBtn",
    "raiseBtn",
    "waterReset",
    "leftBtn",
    "rightBtn",
    "upBtn",
    "downBtn",
    "zoomIn",
    "zoomOut",
    "modelReset"

  ];

  ids.forEach(id => {

    document.getElementById(id).disabled = false;

  });

}


// ==================================
// 七、水位調整
// 只控制水面、浮萍及葉脈
// ==================================

function setWaterLevel(value) {

  if (!modelReady) return;

  const level = THREE.MathUtils.clamp(
    Number(value),
    -0.5,
    0.5
  );

  currentWater = level;


  // 水面移動
  waterNode.position.y =
    waterOriginalPosition.y + level;


  // 浮萍移動
  plantNode.position.y =
    plantOriginalPosition.y + level;


  // 葉脈移動
  if (veinNode) {

    veinNode.position.y =
      veinOriginalPosition.y + level;

  }


  // 更新數字
  slider.value = level;

  waterValue.innerText =
    level.toFixed(2);

}


// 滑桿
slider.addEventListener("input", () => {

  setWaterLevel(slider.value);

});


// 降低水位
document.querySelector("#lowerBtn")
.addEventListener("click", () => {

  setWaterLevel(currentWater - 0.05);

});


// 提高水位
document.querySelector("#raiseBtn")
.addEventListener("click", () => {

  setWaterLevel(currentWater + 0.05);

});


// 恢復水位
document.querySelector("#waterReset")
.addEventListener("click", () => {

  setWaterLevel(INITIAL_WATER);

});


// ==================================
// 八、浮萍旋轉
// ==================================

const angle = Math.PI / 12;

function rotatePlant(x, y) {

  if (!modelReady) return;

  plantNode.rotation.x += x;

  plantNode.rotation.y += y;

}


document.querySelector("#leftBtn")
.addEventListener("click", () => {

  rotatePlant(0, -angle);

});


document.querySelector("#rightBtn")
.addEventListener("click", () => {

  rotatePlant(0, angle);

});


document.querySelector("#upBtn")
.addEventListener("click", () => {

  rotatePlant(-angle, 0);

});


document.querySelector("#downBtn")
.addEventListener("click", () => {

  rotatePlant(angle, 0);

});


// ==================================
// 九、浮萍放大縮小
// ==================================

function zoomPlant(direction) {

  if (!modelReady) return;

  if (direction === "in") {

    zoomFactor = Math.min(
      zoomFactor * 1.2,
      3
    );

  } else {

    zoomFactor = Math.max(
      zoomFactor / 1.2,
      0.3
    );

  }

  plantNode.scale.copy(
    plantOriginalScale
  );

  plantNode.scale.multiplyScalar(
    zoomFactor
  );

}


document.querySelector("#zoomIn")
.addEventListener("click", () => {

  zoomPlant("in");

});


document.querySelector("#zoomOut")
.addEventListener("click", () => {

  zoomPlant("out");

});


// ==================================
// 十、重設浮萍
// ==================================

document.querySelector("#modelReset")
.addEventListener("click", () => {

  if (!modelReady) return;

  zoomFactor = 1;

  plantNode.rotation.copy(
    plantOriginalRotation
  );

  plantNode.scale.copy(
    plantOriginalScale
  );

});

</script>

</body>
</html>
